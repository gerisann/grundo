<!doctype html>
<html lang="hu" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#f7f7fa" />
    <meta name="description" content="GRUNDO — fuss, sétálj vagy bringázz, és foglald el a várost." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <title>GRUNDO</title>

    <!--
      Téma az ELSŐ kirajzolás előtt.

      Ennek a szkriptnek szinkronban, a <body> előtt kell lefutnia, különben
      a felhasználó egy villanásnyi világos felületet lát, mielőtt a sötét
      téma bekapcsol (FOUC). Ezért van inline, és ezért nem modul.

      A pontos logika a src/lib/theme.ts-ben van; itt csak annyi fut, ami a
      helyes első képkockához kell. A React induláskor újraszámol (napnyugta,
      pozíció), és ha kell, finomít.
    -->
    <script>
      (function () {
        try {
          var LIGHT = '#f7f7fa';
          var DARK = '#09080d';

          var saved = localStorage.getItem('grundo.theme');
          var settings = saved ? JSON.parse(saved) : null;
          var mode = (settings && settings.mode) || 'auto';
          var theme;

          if (mode === 'light' || mode === 'dark') {
            theme = mode;
          } else if (mode === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else {
            // 'auto' — a napnyugta-számításhoz pozíció kell, ami itt még
            // nincs. A legutóbb kiszámolt témát használjuk: az szinte mindig
            // helyes, és így nincs villanás. A React indulás után korrigál.
            theme = localStorage.getItem('grundo.theme.last');
            if (theme !== 'light' && theme !== 'dark') {
              var h = new Date().getHours();
              theme = h >= 20 || h < 6 ? 'dark' : 'light';
            }
          }

          document.documentElement.setAttribute('data-theme', theme);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? DARK : LIGHT);
        } catch (e) {
          /* localStorage letiltva — marad a világos alapértelmezés */
        }
      })();
    </script>
    <script>
      /*
        Ez a kód szándékosan nem React-függő: ha maga a modulbetöltés akad el
        iOS WKWebView-ban, különben csak a natív launch screen látszana.
      */
      window.setTimeout(function () {
        if (document.documentElement.dataset.grundoBooted === 'true') return;

        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML =
          '<main style="min-height:100dvh;display:grid;place-items:center;padding:24px;background:#09080d;color:#fff;font-family:system-ui,sans-serif">' +
          '<section style="max-width:420px;text-align:center">' +
          '<h1 style="font-size:24px">A GRUNDO webes felülete nem indult el</h1>' +
          '<p style="color:#c9c2d2;line-height:1.5">Kérjük, küldj visszajelzést a TestFlightból ezzel a hibával: iOS indítási időtúllépés (a JavaScript modul nem indult el).</p>' +
          '<button type="button" onclick="location.reload()" style="border:0;border-radius:12px;padding:13px 18px;background:#8b5cf6;color:#fff;font:inherit">Újrapróbálom</button>' +
          '</section></main>';
      }, 15_000);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
