workflows:
  ios-testflight:
    name: GRUNDO iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: grundo_app_store_connect

    environment:
      groups:
        - grundo_ios
        - grundo_ios_signing
      vars:
        BUNDLE_ID: app.grundo.ios
        LIVE_ACTIVITY_BUNDLE_ID: app.grundo.ios.liveactivity
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22.14.0
      xcode: 26.4

    scripts:
      - name: JavaScript-függőségek telepítése
        script: |
          npm ci
          npm ci --prefix server

      - name: Unit tesztek
        script: npm run test

      - name: Vite production build
        script: |
          export VITE_BUILD_CHANNEL="iOS build ${BUILD_NUMBER}"
          export VITE_GIT_SHA="$(git rev-parse --short HEAD)"
          npm run build

      - name: Capacitor iOS szinkron
        script: npx cap sync ios

      - name: Natív Firebase konfiguráció ellenőrzése
        script: |
          test -f ios/App/App/GoogleService-Info.plist
          grep -q "CapacitorFirebaseMessaging" ios/App/CapApp-SPM/Package.swift
          grep -q "CapacitorFirebaseAppCheck" ios/App/CapApp-SPM/Package.swift
          grep -q "aps-environment" ios/App/App/App.entitlements
          grep -q "com.apple.developer.devicecheck.appattest-environment" ios/App/App/App.entitlements
          xcodebuild -project "$CM_BUILD_DIR/$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -configuration Release -showBuildSettings \
            | grep -q "APS_ENVIRONMENT = production"
          grep -q "NSSupportsLiveActivities" ios/App/App/Info.plist
          grep -q "$LIVE_ACTIVITY_BUNDLE_ID" ios/App/App.xcodeproj/project.pbxproj
          xcodebuild -project "$CM_BUILD_DIR/$XCODE_PROJECT" -list >/dev/null

      - name: Ideiglenes aláíró keychain létrehozása
        script: keychain initialize

      - name: Apple aláírófájlok automatikus létrehozása
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "$LIVE_ACTIVITY_BUNDLE_ID" --type IOS_APP_STORE --create

      - name: Aláíró tanúsítvány betöltése
        script: keychain add-certificates

      - name: Egyedi build number beállítása
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: App Store aláírás beállítása
        script: xcode-project use-profiles

      - name: App Store IPA készítése
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: GRUNDO Android Release
    # Az Individual free csomagban elérhető; Android Gradle buildhöz is megfelel.
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        # Platformfüggetlen VITE_* klienskonfiguráció; Apple signing nincs benne.
        - grundo_ios
        - grundo_android
      android_signing:
        - grundo_android_upload
      vars:
        ANDROID_APPLICATION_ID: app.grundo.android
      node: 22.14.0
      java: 21

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.npm

    scripts:
      - name: JavaScript-függőségek telepítése
        script: |
          npm ci
          npm ci --prefix server

      - name: Unit tesztek
        script: npm run test

      - name: Firebase Android konfiguráció létrehozása
        script: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          node -e 'const fs=require("fs"); fs.writeFileSync("android/app/google-services.json", Buffer.from(process.env.GOOGLE_SERVICES_JSON_BASE64, "base64"));'
          node -e "const f=require('./android/app/google-services.json'); const client=f.client.find(c=>c.client_info?.android_client_info?.package_name===process.env.ANDROID_APPLICATION_ID); if(!client) throw new Error('A google-services.json nem a '+process.env.ANDROID_APPLICATION_ID+' Android apphoz tartozik.'); const oauth=client.oauth_client??[]; if(!oauth.some(c=>c.client_type===1&&c.android_info?.package_name===process.env.ANDROID_APPLICATION_ID)||!oauth.some(c=>c.client_type===3)) throw new Error('A google-services.json nem tartalmazza a natív Google-belépés Android és web OAuth klienseit.');"

      - name: Vite production build
        script: |
          export VITE_BUILD_CHANNEL="Android build ${BUILD_NUMBER}"
          export VITE_GIT_SHA="$(git rev-parse --short HEAD)"
          npm run build

      - name: Capacitor Android szinkron
        script: npx cap sync android

      - name: Android konfiguráció és signing ellenőrzése
        script: |
          test -f android/app/google-services.json
          test -n "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"
          grep -q "applicationId \"$ANDROID_APPLICATION_ID\"" android/app/build.gradle
          grep -q 'targetSdkVersion = 36' android/variables.gradle
          grep -q 'FOREGROUND_SERVICE_LOCATION' android/app/src/main/AndroidManifest.xml
          ! grep -q 'ACCESS_BACKGROUND_LOCATION' android/app/src/main/AndroidManifest.xml
          ! grep -q 'ACTIVITY_RECOGNITION' android/app/src/main/AndroidManifest.xml

      - name: Signed release APK és AAB készítése
        script: |
          cd android
          ./gradlew clean :app:lintRelease :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Android artifactek ellenőrzése
        script: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          test -f android/app/build/outputs/bundle/release/app-release.aab
          APKSIGNER="$(node -e 'const fs=require("fs"),p=require("path"),root=p.join(process.env.ANDROID_HOME,"build-tools"); const versions=fs.readdirSync(root).filter(v=>fs.existsSync(p.join(root,v,"apksigner"))).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})); if(!versions.length) process.exit(1); process.stdout.write(p.join(root,versions[versions.length-1],"apksigner"));')"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          AAB_VERIFY="$(jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab)"
          printf '%s\n' "$AAB_VERIFY"
          printf '%s\n' "$AAB_VERIFY" | grep -q 'jar verified.'

    artifacts:
      - android/app/build/outputs/apk/release/app-release.apk
      - android/app/build/outputs/bundle/release/app-release.aab
      - android/app/build/reports/**

    # A feltöltés innentől ugyanaz a lépés, mint iOS-en a TestFlight: az AAB a
    # build végén MAGÁTÓL felmegy a Play BELSŐ TESZT sávjára, ahol nincs
    # felülvizsgálat, tehát a tesztelők percek alatt frissíthetnek. Eddig ezt
    # kézzel kellett feltölteni a Play Console-ban (Geri kérése, 2026-08-29).
    #
    # ⚠️ A `versionCode` a `BUILD_NUMBER`-ből jön (`android/app/build.gradle`
    # 4. sor), ezért buildenként nő. Enélkül a Play a MÁSODIK feltöltést már
    # elutasítaná: „Version code N has already been used".
    #
    # ⚠️ A `GCLOUD_SERVICE_ACCOUNT_CREDENTIALS` a `grundo_android` csoportban
    # él, SECURE változóként — a `play-publisher@grundo.iam.gserviceaccount.com`
    # szolgáltatásfiók JSON kulcsa. A kulcs önmagában NEM elég: a fiókot a Play
    # Console-ban külön meg kellett hívni („Felhasználók és engedélyek"), és a
    # `androidpublisher.googleapis.com` API-t engedélyezni a `grundo` Cloud
    # projektben. Mindkettő megtörtént.
    #
    # A jogosultság ELLENŐRIZVE (2026-08-29): egy `edits.insert` +
    # `edits.delete` próba mind a négy sávot látta (production, beta, alpha,
    # internal), anélkül hogy bármit publikált volna.
    #
    # A `submit_as_draft: false` miatt a kiadás azonnal él a sávon; `true`
    # esetén vázlat maradna, és kézzel kellene kiadni a Play Console-ban.
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false
