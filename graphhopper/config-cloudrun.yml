# GRUNDO útvonalmotor — Cloud Run konfiguráció.
#
# UGYANAZ, MINT A `config-grundo.yml`, EGYETLEN KÜLÖNBSÉGGEL: a `server`
# szakasz `bind_host`-ja `0.0.0.0`, nem `127.0.0.1`, és a port `8080` (a
# Cloud Run alapértelmezett portja). Helyben a loopback-kötés szándékos
# védelem — itt, konténerben, ennek a fordítottja kell: a Cloud Run kívülről
# (a saját belső hálózatán) éri el a konténer 8080-as portját.
#
# ⚠️ NE FELEJTSD EL ÁTVEZETNI IDE, HA A `config-grundo.yml` `graphhopper:`
# SZAKASZA VÁLTOZIK (profil, encoded_values, stb.) — a két fájl a `server:`
# blokkon kívül szándékosan azonos. Módosítás után a gráfot újra kell
# importálni: lásd `Dockerfile` és `README.md`.

graphhopper:
  datareader.file: hungary-latest.osm.pbf
  graph.location: graph-cache

  custom_models.directory: custom_models

  profiles:
    - name: foot
      turn_costs:
        vehicle_types: [foot]
        u_turn_costs: 40
        allow_turn_penalty_in_request: true
      custom_model_files: [grundo_run.json]
    - name: bike
      turn_costs:
        vehicle_types: [bicycle]
        u_turn_costs: 30
        allow_turn_penalty_in_request: true
      custom_model_files: [grundo_bike.json]

  profiles_ch: []
  profiles_lm: []

  graph.encoded_values: foot_access, foot_priority, foot_average_speed, foot_network, hike_rating, bike_access, bike_priority, bike_average_speed, bike_network, get_off_bike, mtb_rating, roundabout, road_class, road_class_link, road_environment, road_access, surface, smoothness, track_type, max_speed, country, foot_road_access, bike_road_access, orientation

  import.osm.ignored_highways: motorway,trunk

server:
  application_connectors:
    - type: http
      port: 8080
      bind_host: 0.0.0.0
  admin_connectors:
    - type: http
      port: 8081
      bind_host: 127.0.0.1

logging:
  appenders:
    - type: console
      threshold: WARN
