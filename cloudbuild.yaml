# GRUNDO backend build és telepítés.
#
#   gcloud builds submit --config cloudbuild.yaml
#
# A build kontextusa a repo gyökere, mert a szerver a klienssel közös
# játékmotort is fordítja (src/game, src/config, src/types).

substitutions:
  # A Firestore adatbázis (grundo-db) az eur3 multiregionális helyen van.
  # A backendet Európába telepítjük, mert a backend és a Firestore között sok
  # oda-vissza forgalom lesz — és így a magyar felhasználókhoz is közelebb van,
  # mint az USA nyugati partja.
  _REGION: europe-west1
  _SERVICE: grundo-api
  _REPO: grundo

  # A domain levelezőszervere. Ezek nem titkok (a jelszó igen — az Secret
  # Managerből jön), de itt gyűjtve könnyű átállítani, ha szolgáltatót váltasz.
  #
  # A 465-ös port AZONNALI TLS-t jelent (a kapcsolat az első bájttól titkosított),
  # szemben az 587-tel, ahol a beszélgetés közben történik a váltás. A kód a
  # portszámból ismeri fel, melyik kell — lásd a mailer.ts `secure` kapcsolóját.
  _SMTP_HOST: grundo.ultimateteam.hu
  _SMTP_PORT: '465'
  _SMTP_USER: no-reply@grundo.ultimateteam.hu

  # A Mapbox publikus token — a küldetés-ajánló úthálózatához (Directions API).
  #
  # NEM TITOK: ugyanez a token benne van minden kiszolgált kliens-bundle-ben
  # (VITE_MAPBOX_TOKEN), a Mapbox így tervezte. A hozzáférést a Mapbox-fiókon
  # beállítható URL-korlátozás védi, nem a titkossága — ezért sima
  # substitution, nem Secret Manager.
  #
  # ÜRESEN HAGYVA a szerver elindul, csak a küldetés-generálás ad érthető
  # 503-at ("az útvonaltervező nincs beállítva"). Töltsd ki ugyanazzal az
  # értékkel, ami a frontend .env.local-jában van, VAGY add át a
  # telepítésnél: --substitutions=_MAPBOX_TOKEN=pk.xxx
  _MAPBOX_TOKEN: 'pk.eyJ1IjoiZ2VyaXZhZ3lvayIsImEiOiJjbXN1YmR1ZmMwczdzMnpyMWI4ejhvcW0xIn0.fY5XShTyY8Y94h_794WiUw'

steps:
  # FIGYELEM: a címke $BUILD_ID, NEM $SHORT_SHA.
  #
  # A $SHORT_SHA csak akkor van kitöltve, ha a buildet egy repo-trigger
  # indítja. Kézi `gcloud builds submit`-nél üres, és az üres címkéből
  # érvénytelen image-név lesz („…/grundo-api:"), amitől a docker azonnal
  # elhasal 125-ös kóddal — a Dockerfile futtatása előtt.
  # A $BUILD_ID mindkét esetben létezik.
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -f
      - server/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  # A telepítés a konkrét build azonosítójára hivatkozik, nem a `latest`-re —
  # így egyértelmű, melyik verzió fut, és visszaállni is lehet rá.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --min-instances=0
      - --max-instances=4
      # 2 GiB, mert egy nagyon nagy foglalás (Balaton-kör, ~600 km²,
      # ~1,95 millió cella) a számítás alatt ~900 MB-ot vesz igénybe. Mérve
      # ~420 bájt cellánként. A Cloud Run nullára skálázódik, tehát ez csak a
      # tényleges kérések alatt kerül pénzbe.
      - --memory=2Gi
      # A `--set-env-vars` FELÜLÍRJA a szolgáltatás összes környezeti
      # változóját, nem egészíti ki. Ami itt nincs felsorolva, az a telepítés
      # után eltűnik — ezért kell a teljes CORS-lista is itt szerepelnie, nem
      # a Cloud Run konzolban kézzel beállítva.
      #
      # A `^##^` előtag a gcloud lista-elválasztóját cseréli vesszőről `##`-ra.
      # Enélkül az ALLOWED_ORIGINS-ben lévő vesszőket a gcloud új környezeti
      # változók kezdetének nézné, és „Bad syntax for dict arg" hibát adna.
      #
      # A FIREBASE_WEB_API_KEY a felhasználónévvel belépéshez kell: a szerver
      # ezzel ellenőrizteti a jelszót a Google végpontján. NEM titok — ugyanez
      # a kulcs benne van minden kiszolgált kliens-bundle-ben, a Firebase így
      # tervezte. A hozzáférést nem a kulcs titkossága védi, hanem a
      # firestore.rules és a szerveroldali jogosultságkezelés.
      #
      # A levelezés a SAJÁT domain szerverén megy (nincs harmadik fél).
      # A 25-ös port a Google Cloudon kifelé tiltva van, ezért 465 (vagy 587).
      - >-
        --set-env-vars=^##^FIRESTORE_DATABASE_ID=grundo-db##FIREBASE_WEB_API_KEY=AIzaSyCKa86mPUV1AXDRnSc_duZoOYlnFxGcT6w##MAIL_PROVIDER=smtp##MAIL_FROM=GRUNDO <no-reply@grundo.ultimateteam.hu>##SMTP_HOST=${_SMTP_HOST}##SMTP_PORT=${_SMTP_PORT}##SMTP_USER=${_SMTP_USER}##MAPBOX_TOKEN=${_MAPBOX_TOKEN}##ALLOWED_ORIGINS=https://grundo.web.app,https://grundo.ai.studio,http://localhost:5173
      # Az SMTP-jelszó az EGYETLEN valódi titok a szolgáltatásban, ezért nem
      # env-változóként, hanem Secret Managerből érkezik: a repóba így soha nem
      # kerül bele, és cserélni is lehet a kód érintése nélkül.
      #
      # FIGYELEM: a titoknak LÉTEZNIE kell a telepítés előtt, különben a
      # `gcloud run deploy` elhasal. Létrehozás:
      #   read -rsp 'jelszo: ' K && printf '%s' "$K" | \
      #     gcloud secrets create SMTP_PASSWORD --data-file=- && unset K
      #   gcloud secrets add-iam-policy-binding SMTP_PASSWORD \
      #     --member="serviceAccount:65689674957-compute@developer.gserviceaccount.com" \
      #     --role="roles/secretmanager.secretAccessor"
      #
      # A JOBS_TOKEN az ütemezett feladatok megosztott titka. Ezzel a
      # `POST /api/jobs/daily-rollover` pontokat oszt — vagyis valódi titok,
      # nem konfiguráció, ezért ez is Secret Managerbe való.
      #
      # A szerver token NÉLKÜL is elindul: a titok-út egyszerűen zárva marad,
      # és csak admin szerepkörrel lehet jobot indítani. Nem generálunk
      # alapértelmezett jelszót, mert egy hiányzó változó ne nyisson kaput.
      #
      # Az időjáráshoz 2026-08-20 óta NEM KELL titok: a widget az Open-Meteo
      # kulcs nélküli végpontjáról jön (indoklás a weather.ts fejlécében).
      # Az OPENWEATHER_API_KEY ezzel kikerült innen; magát a titkot a Secret
      # Managerben külön kell törölni, ha végleg nem kell.
      #
      # FIGYELEM: MINDKÉT titoknak LÉTEZNIE kell a telepítés előtt, különben
      # a `gcloud run deploy` elhasal. A létrehozás parancsai a
      # docs/06-architektura-es-admin.md alatt vannak, a jobok fejezetében.
      #
      # ⚠️ EBBE A FÁJLBA NE KERÜLJÖN TÖBBSZÖRÖS ESCAPE-ET TARTALMAZÓ PÉLDA.
      # Egy sorvégi backslash és egy idézőjeles minta egyszer már szétvágta a
      # YAML-t (2026-08-19): a build „unexpected end of stream" hibával állt le,
      # és a megjegyzés miatt hasalt el, nem a konfiguráció miatt.
      - --set-secrets=SMTP_PASSWORD=SMTP_PASSWORD:latest,JOBS_TOKEN=JOBS_TOKEN:latest

options:
  logging: CLOUD_LOGGING_ONLY
