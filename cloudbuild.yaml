# GRUNDO backend build és telepítés.
#
#   gcloud builds submit --config cloudbuild.yaml
#
# A build kontextusa a repo gyökere, mert a szerver a klienssel közös
# játékmotort is fordítja (src/game, src/config, src/types).

substitutions:
  # A Firestore adatbázis (grundo-db) az eur3 multiregionális helyen van.
  # A backendet Európába telepítjük, mert a backend és a Firestore között sok
  # oda-vissza forgalom lesz — és így a magyar felhasználókhoz is közelebb van,
  # mint az USA nyugati partja.
  _REGION: europe-west1
  _SERVICE: grundo-api
  _REPO: grundo

steps:
  # FIGYELEM: a címke $BUILD_ID, NEM $SHORT_SHA.
  #
  # A $SHORT_SHA csak akkor van kitöltve, ha a buildet egy repo-trigger
  # indítja. Kézi `gcloud builds submit`-nél üres, és az üres címkéből
  # érvénytelen image-név lesz („…/grundo-api:"), amitől a docker azonnal
  # elhasal 125-ös kóddal — a Dockerfile futtatása előtt.
  # A $BUILD_ID mindkét esetben létezik.
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -f
      - server/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  # A telepítés a konkrét build azonosítójára hivatkozik, nem a `latest`-re —
  # így egyértelmű, melyik verzió fut, és visszaállni is lehet rá.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --min-instances=0
      - --max-instances=4
      - --memory=512Mi
      # A `--set-env-vars` FELÜLÍRJA a szolgáltatás összes környezeti
      # változóját, nem egészíti ki. Ami itt nincs felsorolva, az a telepítés
      # után eltűnik — ezért kell a teljes CORS-lista is itt szerepelnie, nem
      # a Cloud Run konzolban kézzel beállítva.
      #
      # A `^##^` előtag a gcloud lista-elválasztóját cseréli vesszőről `##`-ra.
      # Enélkül az ALLOWED_ORIGINS-ben lévő vesszőket a gcloud új környezeti
      # változók kezdetének nézné, és „Bad syntax for dict arg" hibát adna.
      - >-
        --set-env-vars=^##^FIRESTORE_DATABASE_ID=grundo-db##ALLOWED_ORIGINS=https://grundo.web.app,https://grundo.ai.studio,http://localhost:5173

options:
  logging: CLOUD_LOGGING_ONLY
